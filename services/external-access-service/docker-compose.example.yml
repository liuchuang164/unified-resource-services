services:
  external-access-service:
    image: external-access-service:latest
    container_name: external-access-service
    restart: unless-stopped
    env_file:
      - /etc/external-access-service/external-access-service.env
    ports:
      - "8000:8000"
    volumes:
      - /etc/external-access-service/secrets/farui-api-key.csv:/run/secrets/external-access-service/farui-api-key.csv:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
