services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: data_control
      MINIO_ROOT_PASSWORD: change_me_123456
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 data_control change_me_123456 &&
      mc mb --ignore-existing local/dcs-objects
      "

  postgres-control:
    image: postgres:16
    environment:
      POSTGRES_USER: data_control
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: dcs_control_minio
    ports:
      - "57432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_control -d dcs_control_minio"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-control-minio-data:/var/lib/postgresql/data

  postgres-target:
    image: postgres:16
    environment:
      POSTGRES_USER: data_control
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: dcs_target_minio
    ports:
      - "57433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_control -d dcs_target_minio"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-target-minio-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "57379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-minio-data:/data

volumes:
  minio-data:
  postgres-control-minio-data:
  postgres-target-minio-data:
  redis-minio-data:
