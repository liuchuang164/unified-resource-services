services:
  postgres-control:
    image: postgres:16
    container_name: data-control-reliability-control
    environment:
      POSTGRES_USER: data_control
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: dcs_control_reliability
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_control -d dcs_control_reliability"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-target:
    image: postgres:16
    container_name: data-control-reliability-target
    environment:
      POSTGRES_USER: data_control
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: dcs_target_reliability
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_control -d dcs_target_reliability"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  data-control-reliability-control:
  data-control-reliability-target:
