[project]
name = "data-control-service"
version = "0.1.0"
description = "Database distribution control service phase 1 baseline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "uvicorn[standard]>=0.30.0",
  "structlog>=24.1.0",
  "SQLAlchemy>=2.0.0",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "greenlet>=3.0.0",
  "psycopg[binary]>=3.2.0",
  "redis[hiredis]>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_control_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "postgresql: requires a real PostgreSQL 16 database",
  "migration: exercises Alembic migrations",
  "performance: records development-only baseline timings",
  "reliability: exercises real PostgreSQL reliability behavior",
  "consistency: exercises outbox and idempotency recovery consistency behavior",
  "redis: requires a real Redis 7 server",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
