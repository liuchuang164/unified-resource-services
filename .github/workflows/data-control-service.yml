name: data-control-service

on:
  push:
    branches:
      - main
      - feature/database-distribution-control-service
  pull_request:
    paths:
      - "services/data-control-service/**"
      - "docs/architecture/**"
      - "docs/development/**"
      - "docs/runbooks/**"
      - ".github/workflows/data-control-service.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-control-service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: data_control
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: dcs_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_control -d dcs_control_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      AUTH_PROVIDER: development
      CONTROL_DATABASE_URL: postgresql+asyncpg://data_control:change_me@localhost:5432/dcs_control_test
      CONTROL_DATABASE_MIGRATION_URL: postgresql+psycopg://data_control:change_me@localhost:5432/dcs_control_test
      POSTGRESQL_ADAPTER_ENABLED: "true"
      POSTGRESQL_ADAPTER_REQUIRED: "true"
      POSTGRESQL_ADAPTER_DATABASE_URL: postgresql+asyncpg://data_control:change_me@localhost:5432/dcs_target_test
      TARGET_DATABASE_MIGRATION_URL: postgresql+psycopg://data_control:change_me@localhost:5432/dcs_target_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Create target database
        run: |
          python - <<'PY'
          import psycopg
          conn = psycopg.connect("postgresql://data_control:change_me@localhost:5432/postgres", autocommit=True)
          conn.execute("CREATE DATABASE dcs_target_test")
          conn.close()
          PY
      - name: Migration control
        run: |
          alembic -c alembic-control.ini upgrade head
          alembic -c alembic-control.ini current
          alembic -c alembic-control.ini downgrade -1
          alembic -c alembic-control.ini upgrade head
      - name: Migration target
        run: |
          alembic -c alembic-target.ini upgrade head
          alembic -c alembic-target.ini current
          alembic -c alembic-target.ini downgrade -1
          alembic -c alembic-target.ini upgrade head
      - name: Bootstrap PostgreSQL metadata
        run: python scripts/bootstrap_postgresql.py
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Unit tests
        run: |
          unset CONTROL_DATABASE_URL CONTROL_DATABASE_MIGRATION_URL
          unset POSTGRESQL_ADAPTER_DATABASE_URL TARGET_DATABASE_MIGRATION_URL
          APP_ENV=development POSTGRESQL_ADAPTER_ENABLED=false pytest -q
      - name: PostgreSQL integration tests
        run: pytest -m postgresql -q
      - name: PostgreSQL reliability tests
        run: pytest -m reliability -q
      - name: PostgreSQL consistency tests
        run: pytest -m consistency -q
      - name: Migration tests
        run: pytest -m migration -q
      - name: Performance baseline smoke tests
        run: pytest -m performance -q
      - name: Coverage
        run: |
          unset CONTROL_DATABASE_URL CONTROL_DATABASE_MIGRATION_URL
          unset POSTGRESQL_ADAPTER_DATABASE_URL TARGET_DATABASE_MIGRATION_URL
          APP_ENV=development POSTGRESQL_ADAPTER_ENABLED=false coverage run -m pytest -q
          export APP_ENV=test
          export CONTROL_DATABASE_URL='postgresql+asyncpg://data_control:change_me@localhost:5432/dcs_control_test'
          export CONTROL_DATABASE_MIGRATION_URL='postgresql+psycopg://data_control:change_me@localhost:5432/dcs_control_test'
          export POSTGRESQL_ADAPTER_ENABLED=true
          export POSTGRESQL_ADAPTER_REQUIRED=true
          export POSTGRESQL_ADAPTER_DATABASE_URL='postgresql+asyncpg://data_control:change_me@localhost:5432/dcs_target_test'
          export TARGET_DATABASE_MIGRATION_URL='postgresql+psycopg://data_control:change_me@localhost:5432/dcs_target_test'
          coverage run --append -m pytest -m postgresql -q
          coverage run --append -m pytest -m reliability -q
          coverage run --append -m pytest -m consistency -q
          coverage report --fail-under=85
      - name: Secret scan
        run: |
          ! grep -RInE "BEGIN (RSA|OPENSSH|PRIVATE)|AKIA[0-9A-Z]{16}|password *=|secret *=|api[_-]?key" src tests config README.md

  postgresql-stop-start:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-control-service
    env:
      APP_ENV: test
      AUTH_PROVIDER: development
      CONTROL_DATABASE_URL: postgresql+asyncpg://data_control:change_me@localhost:55432/dcs_control_reliability
      CONTROL_DATABASE_MIGRATION_URL: postgresql+psycopg://data_control:change_me@localhost:55432/dcs_control_reliability
      POSTGRESQL_ADAPTER_ENABLED: "true"
      POSTGRESQL_ADAPTER_REQUIRED: "true"
      POSTGRESQL_ADAPTER_DATABASE_URL: postgresql+asyncpg://data_control:change_me@localhost:55433/dcs_target_reliability
      TARGET_DATABASE_MIGRATION_URL: postgresql+psycopg://data_control:change_me@localhost:55433/dcs_target_reliability
      POSTGRESQL_RELIABILITY_COMPOSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Start dedicated PostgreSQL pair
        run: docker compose -f docker-compose.reliability.yml up -d
      - name: Wait for PostgreSQL pair
        run: |
          docker compose -f docker-compose.reliability.yml exec -T postgres-control pg_isready -U data_control -d dcs_control_reliability
          docker compose -f docker-compose.reliability.yml exec -T postgres-target pg_isready -U data_control -d dcs_target_reliability
      - name: Migration control
        run: alembic -c alembic-control.ini upgrade head
      - name: Migration target
        run: alembic -c alembic-target.ini upgrade head
      - name: Bootstrap PostgreSQL metadata
        run: python scripts/bootstrap_postgresql.py
      - name: Stop start reliability test
        run: pytest tests/reliability/postgresql/test_stop_start.py -q
      - name: Cleanup dedicated PostgreSQL pair
        if: always()
        run: docker compose -f docker-compose.reliability.yml down -v
