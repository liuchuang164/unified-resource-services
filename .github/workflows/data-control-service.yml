name: data-control-service

on:
  push:
    branches:
      - main
      - feature/database-distribution-control-service
  pull_request:
    paths:
      - "services/data-control-service/**"
      - "docs/architecture/**"
      - "docs/development/**"
      - "docs/runbooks/**"
      - ".github/workflows/data-control-service.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-control-service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: data_control
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: dcs_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U data_control -d dcs_control_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      AUTH_PROVIDER: development
      CONTROL_DATABASE_URL: postgresql+asyncpg://data_control:change_me@localhost:5432/dcs_control_test
      CONTROL_DATABASE_MIGRATION_URL: postgresql+psycopg://data_control:change_me@localhost:5432/dcs_control_test
      POSTGRESQL_ADAPTER_ENABLED: "true"
      POSTGRESQL_ADAPTER_REQUIRED: "true"
      POSTGRESQL_ADAPTER_DATABASE_URL: postgresql+asyncpg://data_control:change_me@localhost:5432/dcs_target_test
      TARGET_DATABASE_MIGRATION_URL: postgresql+psycopg://data_control:change_me@localhost:5432/dcs_target_test
      REDIS_ADAPTER_ENABLED: "true"
      REDIS_ADAPTER_REQUIRED: "true"
      REDIS_URL: redis://localhost:6379/0
      MINIO_ADAPTER_ENABLED: "true"
      MINIO_ADAPTER_REQUIRED: "true"
      MINIO_ENDPOINT: localhost:9000
      MINIO_SECURE: "false"
      MINIO_ACCESS_KEY: data_control
      MINIO_SECRET_KEY: change_me_123456
      MINIO_DEFAULT_BUCKET: dcs-objects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Create target database
        run: |
          python - <<'PY'
          import psycopg
          conn = psycopg.connect("postgresql://data_control:change_me@localhost:5432/postgres", autocommit=True)
          conn.execute("CREATE DATABASE dcs_target_test")
          conn.close()
          PY
      - name: Start MinIO service
        run: |
          docker run -d --name dcs-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=data_control \
            -e MINIO_ROOT_PASSWORD=change_me_123456 \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          python - <<'PY'
          import time
          from minio import Minio

          client = Minio("localhost:9000", access_key="data_control", secret_key="change_me_123456", secure=False)
          for _ in range(30):
              try:
                  client.list_buckets()
                  raise SystemExit(0)
              except Exception:
                  time.sleep(2)
          raise SystemExit(1)
          PY
      - name: Migration control
        run: |
          alembic -c alembic-control.ini upgrade head
          alembic -c alembic-control.ini current
          alembic -c alembic-control.ini downgrade -1
          alembic -c alembic-control.ini upgrade head
      - name: Migration target
        run: |
          alembic -c alembic-target.ini upgrade head
          alembic -c alembic-target.ini current
          alembic -c alembic-target.ini downgrade -1
          alembic -c alembic-target.ini upgrade head
      - name: Bootstrap PostgreSQL metadata
        run: python scripts/bootstrap_postgresql.py
      - name: Create MinIO bucket
        run: |
          python - <<'PY'
          from minio import Minio
          client = Minio("localhost:9000", access_key="data_control", secret_key="change_me_123456", secure=False)
          if not client.bucket_exists("dcs-objects"):
              client.make_bucket("dcs-objects")
          PY
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Unit tests
        run: |
          unset CONTROL_DATABASE_URL CONTROL_DATABASE_MIGRATION_URL
          unset POSTGRESQL_ADAPTER_DATABASE_URL TARGET_DATABASE_MIGRATION_URL
          unset REDIS_URL MINIO_ENDPOINT MINIO_ACCESS_KEY MINIO_SECRET_KEY
          APP_ENV=development POSTGRESQL_ADAPTER_ENABLED=false REDIS_ADAPTER_ENABLED=false MINIO_ADAPTER_ENABLED=false pytest -q
      - name: PostgreSQL integration tests
        run: pytest -m postgresql -q
      - name: PostgreSQL reliability tests
        run: pytest -m reliability -q
      - name: PostgreSQL consistency tests
        run: pytest -m consistency -q
      - name: Redis integration and security tests
        run: pytest -m redis -q
      - name: MinIO integration and security tests
        run: pytest -m minio -q
      - name: Migration tests
        run: pytest -m migration -q
      - name: Performance baseline smoke tests
        run: pytest -m performance -q
      - name: Coverage
        run: |
          unset CONTROL_DATABASE_URL CONTROL_DATABASE_MIGRATION_URL
          unset POSTGRESQL_ADAPTER_DATABASE_URL TARGET_DATABASE_MIGRATION_URL
          unset REDIS_URL MINIO_ENDPOINT MINIO_ACCESS_KEY MINIO_SECRET_KEY
          APP_ENV=development POSTGRESQL_ADAPTER_ENABLED=false REDIS_ADAPTER_ENABLED=false MINIO_ADAPTER_ENABLED=false coverage run -m pytest -q
          export APP_ENV=test
          export CONTROL_DATABASE_URL='postgresql+asyncpg://data_control:change_me@localhost:5432/dcs_control_test'
          export CONTROL_DATABASE_MIGRATION_URL='postgresql+psycopg://data_control:change_me@localhost:5432/dcs_control_test'
          export POSTGRESQL_ADAPTER_ENABLED=true
          export POSTGRESQL_ADAPTER_REQUIRED=true
          export POSTGRESQL_ADAPTER_DATABASE_URL='postgresql+asyncpg://data_control:change_me@localhost:5432/dcs_target_test'
          export TARGET_DATABASE_MIGRATION_URL='postgresql+psycopg://data_control:change_me@localhost:5432/dcs_target_test'
          coverage run --append -m pytest -m postgresql -q
          coverage run --append -m pytest -m reliability -q
          coverage run --append -m pytest -m consistency -q
          coverage run --append -m pytest -m redis -q
          coverage run --append -m pytest -m minio -q
          coverage report --fail-under=85
      - name: Secret scan
        run: |
          ! grep -RInE "BEGIN (RSA|OPENSSH|PRIVATE)|AKIA[0-9A-Z]{16}|password *=|secret *=|api[_-]?key" src tests config README.md \
            | grep -v "hide_password=True"
      - name: Cleanup MinIO service
        if: always()
        run: docker rm -f dcs-minio || true

  postgresql-stop-start:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-control-service
    env:
      APP_ENV: test
      AUTH_PROVIDER: development
      CONTROL_DATABASE_URL: postgresql+asyncpg://data_control:change_me@localhost:55432/dcs_control_reliability
      CONTROL_DATABASE_MIGRATION_URL: postgresql+psycopg://data_control:change_me@localhost:55432/dcs_control_reliability
      POSTGRESQL_ADAPTER_ENABLED: "true"
      POSTGRESQL_ADAPTER_REQUIRED: "true"
      POSTGRESQL_ADAPTER_DATABASE_URL: postgresql+asyncpg://data_control:change_me@localhost:55433/dcs_target_reliability
      TARGET_DATABASE_MIGRATION_URL: postgresql+psycopg://data_control:change_me@localhost:55433/dcs_target_reliability
      POSTGRESQL_RELIABILITY_COMPOSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Start dedicated PostgreSQL pair
        run: docker compose -f docker-compose.reliability.yml up -d
      - name: Wait for PostgreSQL pair
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.reliability.yml exec -T postgres-control pg_isready -U data_control -d dcs_control_reliability \
              && docker compose -f docker-compose.reliability.yml exec -T postgres-target pg_isready -U data_control -d dcs_target_reliability; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.reliability.yml ps
          exit 1
      - name: Migration control
        run: alembic -c alembic-control.ini upgrade head
      - name: Migration target
        run: alembic -c alembic-target.ini upgrade head
      - name: Bootstrap PostgreSQL metadata
        run: python scripts/bootstrap_postgresql.py
      - name: Stop start reliability test
        run: pytest tests/reliability/postgresql/test_stop_start.py -q
      - name: Cleanup dedicated PostgreSQL pair
        if: always()
        run: docker compose -f docker-compose.reliability.yml down -v

  redis-stop-start:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-control-service
    env:
      APP_ENV: test
      AUTH_PROVIDER: development
      CONTROL_DATABASE_URL: postgresql+asyncpg://data_control:change_me@localhost:56432/dcs_control_redis
      CONTROL_DATABASE_MIGRATION_URL: postgresql+psycopg://data_control:change_me@localhost:56432/dcs_control_redis
      POSTGRESQL_ADAPTER_ENABLED: "true"
      POSTGRESQL_ADAPTER_REQUIRED: "true"
      POSTGRESQL_ADAPTER_DATABASE_URL: postgresql+asyncpg://data_control:change_me@localhost:56433/dcs_target_redis
      TARGET_DATABASE_MIGRATION_URL: postgresql+psycopg://data_control:change_me@localhost:56433/dcs_target_redis
      REDIS_ADAPTER_ENABLED: "true"
      REDIS_ADAPTER_REQUIRED: "true"
      REDIS_URL: redis://localhost:56379/0
      REDIS_RELIABILITY_COMPOSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Start dedicated Redis stack
        run: docker compose -f docker-compose.redis.yml up -d
      - name: Wait for Redis stack
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.redis.yml exec -T redis redis-cli ping \
              && docker compose -f docker-compose.redis.yml exec -T postgres-control pg_isready -U data_control -d dcs_control_redis \
              && docker compose -f docker-compose.redis.yml exec -T postgres-target pg_isready -U data_control -d dcs_target_redis; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.redis.yml ps
          exit 1
      - name: Migration control
        run: alembic -c alembic-control.ini upgrade head
      - name: Migration target
        run: alembic -c alembic-target.ini upgrade head
      - name: Bootstrap metadata
        run: python scripts/bootstrap_postgresql.py
      - name: Redis stop start reliability test
        run: pytest tests/reliability/redis/test_stop_start.py -q
      - name: Cleanup dedicated Redis stack
        if: always()
        run: docker compose -f docker-compose.redis.yml down -v

  minio-stop-start:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-control-service
    env:
      APP_ENV: test
      AUTH_PROVIDER: development
      CONTROL_DATABASE_URL: postgresql+asyncpg://data_control:change_me@localhost:57432/dcs_control_minio
      CONTROL_DATABASE_MIGRATION_URL: postgresql+psycopg://data_control:change_me@localhost:57432/dcs_control_minio
      POSTGRESQL_ADAPTER_ENABLED: "true"
      POSTGRESQL_ADAPTER_REQUIRED: "true"
      POSTGRESQL_ADAPTER_DATABASE_URL: postgresql+asyncpg://data_control:change_me@localhost:57433/dcs_target_minio
      TARGET_DATABASE_MIGRATION_URL: postgresql+psycopg://data_control:change_me@localhost:57433/dcs_target_minio
      REDIS_ADAPTER_ENABLED: "true"
      REDIS_ADAPTER_REQUIRED: "true"
      REDIS_URL: redis://localhost:57379/0
      MINIO_ADAPTER_ENABLED: "true"
      MINIO_ADAPTER_REQUIRED: "true"
      MINIO_ENDPOINT: localhost:59000
      MINIO_SECURE: "false"
      MINIO_ACCESS_KEY: data_control
      MINIO_SECRET_KEY: change_me_123456
      MINIO_DEFAULT_BUCKET: dcs-objects
      MINIO_RELIABILITY_COMPOSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Start dedicated MinIO stack
        run: docker compose -f docker-compose.minio.yml up -d
      - name: Wait for MinIO stack
        run: |
          python - <<'PY'
          import subprocess
          import time
          from minio import Minio

          client = Minio("localhost:59000", access_key="data_control", secret_key="change_me_123456", secure=False)
          checks = [
              ["docker", "compose", "-f", "docker-compose.minio.yml", "exec", "-T", "postgres-control", "pg_isready", "-U", "data_control", "-d", "dcs_control_minio"],
              ["docker", "compose", "-f", "docker-compose.minio.yml", "exec", "-T", "postgres-target", "pg_isready", "-U", "data_control", "-d", "dcs_target_minio"],
              ["docker", "compose", "-f", "docker-compose.minio.yml", "exec", "-T", "redis", "redis-cli", "ping"],
          ]
          for _ in range(30):
              try:
                  client.list_buckets()
                  if all(subprocess.run(cmd, check=False).returncode == 0 for cmd in checks):
                      raise SystemExit(0)
              except Exception:
                  pass
              time.sleep(2)
          subprocess.run(["docker", "compose", "-f", "docker-compose.minio.yml", "ps"], check=False)
          raise SystemExit(1)
          PY
      - name: Ensure MinIO bucket
        run: docker compose -f docker-compose.minio.yml run --rm minio-init
      - name: Migration control
        run: alembic -c alembic-control.ini upgrade head
      - name: Migration target
        run: alembic -c alembic-target.ini upgrade head
      - name: Bootstrap metadata
        run: python scripts/bootstrap_postgresql.py
      - name: MinIO stop start reliability test
        run: pytest tests/reliability/minio/test_stop_start.py -q
      - name: Cleanup dedicated MinIO stack
        if: always()
        run: docker compose -f docker-compose.minio.yml down -v
